services:
  backend:
    build:
      context: ./backend
    container_name: welcome-desk-backend
    restart: unless-stopped
    environment:
      OS_LLM_URL: http://ollama:11434
      OS_LLM_MODEL: ${OS_LLM_MODEL}
      OS_LLM_EMBEDDING_MODEL: ${OS_LLM_EMBEDDING_MODEL}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
    ports:
      - ${BACKEND_PORT}:8080
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./Daniel-CV-Welcome-Desk-Frontend
    container_name: welcome-desk-frontend
    restart: unless-stopped
    environment:
      - QUESTION_URL=${QUESTION_URL}
      - DOWNLOAD_URL=${DOWNLOAD_URL}
      - LINKEDIN_URL=${LINKEDIN_URL}

    ports:
      - 80:3000
    depends_on:
      - backend
    networks:
      - internal
      - egress

  qdrant:
    image: qdrant/qdrant:dev
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    networks:
      - internal

  ollama:
    image: ollama/ollama:0.21.3-rc0-rocm
    tty: true
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_HOST: ${OLLAMA_HOST}
    volumes:
      - ./volumes/ollama/ollama:/root/.ollama
    ports:
      - ${OLLAMA_PORT}:11434
    healthcheck:
      test: [ "CMD-SHELL", "ollama list >/dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - internal

networks:
  egress:
    name: welcomeDeskEgress
  internal:
    name: welcomeDeskInternal

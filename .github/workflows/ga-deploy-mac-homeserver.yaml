name: Build, Push to GHCR, Deploy to Coolify

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND: welcome-desk-backend
  FRONTEND: welcome-desk-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image and push to registry
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND }}:latest
      - name: Build frontend image and push to registry
        uses: docker/build-push-action@v4
        with:
          context: ./Daniel-CV-Welcome-Desk-Frontend/
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND}}:latest
      - name: Trigger Coolify deployment
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
              echo "Missing COOLIFY_WEBHOOK_URL secret"
              exit 1
          fi
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'